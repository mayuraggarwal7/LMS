{% with u=request.resolver_match.url_name %}
  <div class="nav-group">
    <a href="{% url 'dashboard' %}" class="{% if u == 'dashboard' %}active{% endif %}"><span class="ico">🏠</span>Dashboard</a>
    {% if user.student_profile %}<a href="{% url 'my_progress' %}" class="{% if u == 'student_detail' and not user.is_staff %}active{% endif %}"><span class="ico">📈</span>My progress</a>{% endif %}
    {% if user.faculty_profile %}<a href="{% url 'my_hr' %}" class="{% if u == 'faculty_detail' and not user.is_staff %}active{% endif %}"><span class="ico">🪪</span>My HR</a>{% endif %}
  </div>
{% endwith %}
