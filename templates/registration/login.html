{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card auth-card">
  <h1>Welcome back</h1>
  <p class="sub">Plan, teach, assess — all in one place.</p>
  <form method="post">{% csrf_token %}
    {% include "includes/form_fields.html" %}
    <button class="btn primary big" style="width:100%">Log in</button>
  </form>
  <p class="sub center" style="margin-top:1rem">New here? <a href="{% url 'signup' %}">Create an account</a></p>
</div>
{% endblock %}
